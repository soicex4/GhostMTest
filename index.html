<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Ghost Online Simulator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Kanit', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    .panel {
      background-color: #1e1e24;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    h2 { text-align: center; margin-top: 0; }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label { font-weight: 600; width: 30%; font-size: 14px; }
    input, select {
      width: 65%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a35;
      color: white;
      font-family: 'Kanit', sans-serif;
      box-sizing: border-box;
    }
    input:focus, select:focus { outline: none; border-color: #4caf50; }
    .btn-start {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #4caf50, #2e7d32);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-start:hover { filter: brightness(1.2); }
  </style>
</head>
<body>

  <h1 style="text-align:center;">👻 Ghost Online Simulator</h1>
  
  <div class="panel">
    <h2>อัปสเตตัสตัวละคร (เริ่มต้น)</h2>
    
    <div class="form-group">
      <label>ชื่อตัวละคร:</label>
      <input type="text" id="charName" placeholder="ใส่ชื่อสุดเท่...">
    </div>
    <div class="form-group">
      <label>อาชีพ:</label>
      <select id="jobClass" onchange="updateFactionState()">
        <option value="mamluk">มัมลุค</option>
        <option value="hero">จอมยุทธ</option>
        <option value="mage">นักพรต</option>
        <option value="fighter">จอมพลัง</option>
        <option value="ninja">นินจา</option>
        <option value="police">มือปราบ</option>
        <option value="knight">นักรบ</option>
        <option value="assassin">มือสังหาร</option>
      </select>
    </div>
    <div class="form-group">
      <label>ฝ่าย:</label>
      <select id="faction">
        <option value="ธรรมะ">ธรรมะ (Justice)</option>
        <option value="อธรรม">อธรรม (Chaos)</option>
        <option value="มาร">มาร (Evil)</option>
      </select>
    </div>
    <div class="form-group">
      <label>เลเวล (Lv):</label>
      <input type="number" id="level" value="1" min="1" max="200">
    </div>

    <hr style="border-color:#444; margin:20px 0;">

    <div class="form-group"><label>STR:</label><input type="number" id="str" value="3"></div>
    <div class="form-group"><label>DEX:</label><input type="number" id="dex" value="3"></div>
    <div class="form-group"><label>CON:</label><input type="number" id="con" value="3"></div>
    <div class="form-group"><label>INT:</label><input type="number" id="int" value="3"></div>

    <button class="btn-start" onclick="goToMainApp()">เข้าสู่ระบบจำลองสเตตัส 🚀</button>
  </div>

  <script>
    // ล็อกฝ่ายมารให้อัตโนมัติถ้าเป็นมัมลุค/มือสังหาร
    function updateFactionState() {
      const job = document.getElementById('jobClass').value;
      const factionSelect = document.getElementById('faction');
      if (job === 'mamluk' || job === 'assassin') {
        factionSelect.value = 'มาร';
        factionSelect.disabled = true;
      } else {
        factionSelect.disabled = false;
        if(factionSelect.value === 'มาร') factionSelect.value = 'ธรรมะ';
      }
    }

    // ฟังก์ชันรวบรวมข้อมูลแล้วส่งทะลุมิติไปไฟล์ index.html
    function goToMainApp() {
      const params = new URLSearchParams();
      params.append('name', document.getElementById('charName').value);
      params.append('job', document.getElementById('jobClass').value);
      params.append('faction', document.getElementById('faction').value); // ดึงค่าฝ่ายไปด้วย
      params.append('lv', document.getElementById('level').value);
      params.append('str', document.getElementById('str').value);
      params.append('dex', document.getElementById('dex').value);
      params.append('con', document.getElementById('con').value);
      params.append('int', document.getElementById('int').value);

      // สั่งเปลี่ยนหน้าต่างไปยัง index.html พร้อมพ่วงข้อมูลไปใน URL
      window.location.href = 'main.html?' + params.toString();
    }

    window.onload = updateFactionState;
  </script>
</body>
</html>
