<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP SYSTEM - Futuristic Platinum</title>
    <style>
        /* ธีม ขาว-แพลทินัมล้ำอนาคต */
        body {
            background-color: #f5f7fa;
            color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #e0e5ec, #ffffff);
            border: 2px solid #c0c6d4;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            padding: 15px 30px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .neon-text {
            color: #0088ff;
            text-shadow: 0 0 10px rgba(0, 136, 255, 0.5);
            font-weight: bold;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
        }
        /* Holographic Tooltip */
        .skill-item {
            position: relative;
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s;
        }
        .skill-item:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
        .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #00d2ff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 12px;
            width: 300px;
            z-index: 100;
            transition: all 0.2s;
        }
        .skill-item:hover .tooltip {
            visibility: visible;
            opacity: 1;
            top: 110%;
        }
        .tooltip h4 { margin: 0 0 10px 0; color: #0088ff; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 5px;}
        .grid-4d { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; }
        .grid-box { background: #f8f9fa; padding: 8px; border-radius: 6px; text-align: center; }
        .btn-buff { background: #ff4757; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;}
    </style>
</head>
<body>

    <!-- Bouncer Script: การ์ดเฝ้าประตู -->
    <script>
        if(!localStorage.getItem('vip_token')) {
            window.location.href = 'index.html'; // เตะกลับถ้าไม่มีตั๋ว
        }
    </script>

    <div class="header">
        <div>
            <h2><span class="neon-text">VIP COMMAND CENTER</span></h2>
        </div>
        <div style="font-size: 1.2em; font-weight: bold;">
            👤 <span id="displayUser">Unknown</span> | 🌟 Lv. <span id="displayLv">0</span>
        </div>
        <button onclick="logout()" style="padding: 8px 15px; border-radius: 6px; cursor: pointer;">ออกจากระบบ</button>
    </div>

    <div class="container">
        <!-- ฝั่งซ้าย: Core System (PvP & Base) -->
        <div class="panel">
            <h3 class="neon-text">⚔️ ระบบคำนวณสมรภูมิ (PvP Core)</h3>
            <p>อาวุธหลัก: 
                <select id="mainWeapon" style="padding: 5px;">
                    <option value="sword">ดาบ</option>
                    <option value="glove">ปลอกแขน</option>
                </select>
            </p>
            <hr>
            <p>ดาเมจพื้นฐาน (จำลอง): <input type="number" id="baseAtk" value="100000" style="width: 100px;"></p>
            <p>ดาเมจคริติคอล (%): <input type="number" id="critDmg" value="324" style="width: 80px;"> %</p>
            <p>PVP ATK Buff: <input type="number" id="pvpAtk" value="4.4" style="width: 80px;"> %</p>
            <p>PVP DEF บัฟยา (ศัตรู):</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-buff" onclick="setEnemyDef(200)">ยา 200%</button>
                <button class="btn-buff" onclick="setEnemyDef(400)">ยา 400%</button>
                <button class="btn-buff" onclick="setEnemyDef(600)">ยา 600%</button>
            </div>
            <p><em>*ศัตรูใช้ยาบัฟป้องกัน PvP: <span id="enemyDefText">0</span>%</em></p>
        </div>

        <!-- ฝั่งขวา: Skill Matrix (อาชีพมัมลุค) -->
        <div class="panel">
            <h3 class="neon-text">🌀 ลานประลองวิชา (Skill Matrix)</h3>
            <div style="background: #eef2f5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold;">
                แต้มวิชาคงเหลือ: <span id="spCurrent" style="color: #0088ff; font-size: 1.2em;">211</span> / <span id="spMax">211</span>
            </div>

            <!-- ตัวอย่างสกิล (จำลอง) -->
            <div id="skillList">
                <!-- สกิลจะถูกสร้างด้วย JS -->
            </div>
        </div>
    </div>

    <script>
        // โหลดข้อมูล VIP
        const charName = localStorage.getItem('vip_char_name') || 'เดะวินนะ';
        const charLv = parseInt(localStorage.getItem('vip_char_level')) || 126;
        document.getElementById('displayUser').innerText = charName;
        document.getElementById('displayLv').innerText = charLv;

        // คำนวณแต้มสกิล (สมมติสูตร: เวล 126 ได้ 211 แต้ม)
        let totalSp = 211; // ลูกพี่สามารถเปลี่ยนสมการนี้ตามจริงได้
        let currentSp = totalSp;
        document.getElementById('spMax').innerText = totalSp;
        
        let enemyPvpDef = 0;
        function setEnemyDef(val) {
            enemyPvpDef = val;
            document.getElementById('enemyDefText').innerText = val;
            renderSkills(); // อัปเดตตารางดาเมจทันที
        }

        // ระบบสมการสัตว์เลี้ยงแฝงทะลวงพาสซีฟ (ดึงค่าจากหน้าแรก - จำลองเป็น Lv.2)
        const petMixLevel = 2; // ของจริงดึงค่า localStorage ของหน้าแรกมาใส่
        const passiveWeaponBonusLevel = petMixLevel; // สัตว์เลี้ยงบวกเลเวลให้พาสซีฟอาวุธ
        
        // ฐานข้อมูลวิชามัมลุค (ลูกพี่เพิ่มสกิลใน Array นี้ได้เลย)
        let skills = [
            { id: 1, name: "[T] ดาบฟ้าสวรรค์ (ML)", type: "sword", maxLv: 20, currentLv: 20, basePct: 300, pctPerLv: 15 },
            { id: 2, name: "[T] อัสนีเมฆา (ML)", type: "glove", maxLv: 20, currentLv: 1, basePct: 200, pctPerLv: 10 },
            { id: 3, name: "[T] ปราณราชสีห์คลั่ง (ML)", type: "buff", maxLv: 20 + passiveWeaponBonusLevel, currentLv: 22, basePct: 0, pctPerLv: 2, isOverlimit: true } // ทะลุเพดาน
        ];

        function calculateDamage(skill) {
            const baseAtk = parseFloat(document.getElementById('baseAtk').value);
            const critMulti = parseFloat(document.getElementById('critDmg').value) / 100;
            const pvpAtkBonus = parseFloat(document.getElementById('pvpAtk').value) / 100;
            const mainWeapon = document.getElementById('mainWeapon').value;
            
            // โบนัสพาสซีฟสัตว์เลี้ยง (ถ้าอาวุธตรงสาย)
            let weaponBonusPct = 0;
            if (skill.type === mainWeapon) {
                // สมมติ: เลเวลพาสซีฟ = 10 (เต็ม) + สัตว์เลี้ยงโบนัส
                let passiveLv = 10 + passiveWeaponBonusLevel;
                weaponBonusPct = passiveLv * 0.05; // สมมติเวลละ 5% (เช่น 12 * 5 = 60%)
            }

            let skillMultiplier = (skill.basePct + (skill.currentLv * skill.pctPerLv)) / 100;
            let finalMulti = skillMultiplier + weaponBonusPct;

            // คำนวณ 4 มิติ
            let pveNormal = baseAtk * finalMulti;
            let pveCrit = pveNormal * critMulti;
            
            // PvP คำนวณหักลบเกราะศัตรู
            let pvpMulti = 1 + pvpAtkBonus - (enemyPvpDef / 100);
            if(pvpMulti < 0.1) pvpMulti = 0.1; // ดาเมจต่ำสุดถ้าเกราะหนามาก
            
            let pvpNormal = pveNormal * pvpMulti;
            let pvpCrit = pvpNormal * critMulti;

            return {
                pve: Math.floor(pveNormal).toLocaleString(), pveC: Math.floor(pveCrit).toLocaleString(),
                pvp: Math.floor(pvpNormal).toLocaleString(), pvpC: Math.floor(pvpCrit).toLocaleString(),
                pct: Math.floor(finalMulti * 100)
            };
        }

        function renderSkills() {
            const list = document.getElementById('skillList');
            list.innerHTML = '';
            document.getElementById('spCurrent').innerText = currentSp;

            skills.forEach((s, index) => {
                let dmg = calculateDamage(s);
                let overlimitText = s.isOverlimit ? `<span style="color:#ff4757; font-size:0.8em;">(สัตว์เลี้ยง +${passiveWeaponBonusLevel})</span>` : '';
                
                list.innerHTML += `
                    <div class="skill-item">
                        <div>
                            <strong>${s.name}</strong> <br>
                            <span style="color: #888;">Lv. ${s.currentLv} / ${s.maxLv} ${overlimitText}</span>
                        </div>
                        <div>
                            <button onclick="adjustSkill(${index}, -1)">-</button>
                            <button onclick="adjustSkill(${index}, 1)">+</button>
                        </div>
                        
                        <!-- หน้าต่างโฮโลแกรม 4D ซ่อนอยู่ -->
                        <div class="tooltip">
                            <h4>วิเคราะห์ดาเมจ (${dmg.pct}%)</h4>
                            <div class="grid-4d">
                                <div class="grid-box"><strong>👾 PvE (ปกติ)</strong><br><span style="color:#2ecc71;">${dmg.pve}</span></div>
                                <div class="grid-box"><strong>💥 PvE (คริ)</strong><br><span style="color:#e74c3c;">${dmg.pveC}</span></div>
                                <div class="grid-box"><strong>🥷 PvP (ตีคน)</strong><br><span style="color:#f39c12;">${dmg.pvp}</span></div>
                                <div class="grid-box"><strong>💀 PvP (คริ)</strong><br><span style="color:#c0392b;">${dmg.pvpC}</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function adjustSkill(index, amount) {
            let s = skills[index];
            if (amount > 0 && currentSp > 0 && s.currentLv < s.maxLv) {
                s.currentLv++;
                currentSp--;
            } else if (amount < 0 && s.currentLv > 0) {
                s.currentLv--;
                currentSp++;
            }
            renderSkills();
        }

        function logout() {
            localStorage.removeItem('vip_token');
            window.location.href = 'index.html';
        }

        // โหลดข้อมูลครั้งแรก
        renderSkills();
    </script>
</body>
</html>
